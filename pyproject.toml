[project]
name = "model-context-api"
version = "0.1.1"
description = "Model Context API for AI Agents"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
ninja = [
    "django>=6.1.1",
    "django-ninja>=1.7.0",
]
mcp = [
    "mcp>=2.2,<3",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mca"
module-root = ""

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
